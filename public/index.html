<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Room</title>
<meta name="description" content="Live AI case interview practice — self-hosted, bring your own free-tier API key.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout concept: setup -> live session -> debrief in one pane; timers pinned
     top-right and always visible, transcript scrolls, case card stays put. */
  :root{
    color-scheme: light;
    --bg:        #f5f3ee;
    --surface:   #ffffff;
    --surface-2: #ebe8e0;
    --surface-3: #e0ddd1;
    --ink:       #1b1a17;
    --ink-soft:  #58544a;
    --muted:     #8a8577;
    --line:      #ddd6c7;
    --accent:    #1f6f5c;
    --accent-ink:#ffffff;
    --accent-soft:#dcece6;
    --good:      #1f8a4c;
    --warn:      #b07a0f;
    --bad:       #b1402f;
    --good-bg:   #e3f3e8;
    --warn-bg:   #f7ecd6;
    --bad-bg:    #f8e1dc;
    --shadow: 0 1px 2px rgba(27,26,23,0.06), 0 8px 24px -10px rgba(27,26,23,0.18);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:        #14161a;
      --surface:   #1b1e23;
      --surface-2: #23272d;
      --surface-3: #2a2f36;
      --ink:       #ece9e1;
      --ink-soft:  #b2ad9f;
      --muted:     #847f70;
      --line:      #2d3139;
      --accent:    #5fcdb0;
      --accent-ink:#0d241e;
      --accent-soft:#1c3832;
      --good:      #4fca7a;
      --warn:      #e0b24a;
      --bad:       #e8705c;
      --good-bg:   #1b2f20;
      --warn-bg:   #332a16;
      --bad-bg:    #35221d;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -10px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:        #14161a;
    --surface:   #1b1e23;
    --surface-2: #23272d;
    --surface-3: #2a2f36;
    --ink:       #ece9e1;
    --ink-soft:  #b2ad9f;
    --muted:     #847f70;
    --line:      #2d3139;
    --accent:    #5fcdb0;
    --accent-ink:#0d241e;
    --accent-soft:#1c3832;
    --good:      #4fca7a;
    --warn:      #e0b24a;
    --bad:       #e8705c;
    --good-bg:   #1b2f20;
    --warn-bg:   #332a16;
    --bad-bg:    #35221d;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -10px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:"Libre Baskerville", Georgia, serif; font-weight:700; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  .shell{ max-width:880px; margin:0 auto; padding:22px 20px 70px; }
  .topbar{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:6px 0 16px; border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  .brand{ display:flex; align-items:center; gap:9px; cursor:pointer; background:none; border:none; padding:0; color:var(--ink); }
  .brand .mark{ font-size:1.3rem; line-height:1; }
  .brand h1{ font-size:1.15rem; letter-spacing:-0.01em; }
  .topbar-spacer{ flex:1; }
  .theme-toggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .card + .card{ margin-top:16px; }
  .hero p{ color:var(--ink-soft); font-size:0.95rem; max-width:62ch; margin:8px 0 0; }

  /* ---- setup: source tabs ---- */
  .source-tabs{ display:flex; gap:6px; margin:18px 0 16px; flex-wrap:wrap; }
  .source-tab{
    flex:1 1 150px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft);
    border-radius:9px; padding:11px 12px; cursor:pointer; text-align:left;
  }
  .source-tab .st-name{ font-weight:700; font-size:0.86rem; color:var(--ink); }
  .source-tab .st-sub{ font-size:0.74rem; margin-top:2px; }
  .source-tab.active{ background:var(--accent-soft); border-color:var(--accent); }
  .source-tab.active .st-name{ color:var(--accent); }

  .field-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .field{ flex:1 1 160px; min-width:0; }
  .field label{ display:block; font-family:"IBM Plex Mono"; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:5px; }
  select, input[type="text"], textarea{
    width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:8px 10px; font:inherit; font-size:0.86rem;
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .diff-row{ display:flex; gap:6px; }
  .diff-btn{
    flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    border-radius:8px; padding:8px 0; cursor:pointer; font-size:0.82rem; font-weight:600; text-align:center;
  }
  .diff-btn.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .btn{
    border:none; border-radius:9px; padding:10px 18px; font-weight:700; font-size:0.86rem; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-primary:disabled{ opacity:0.45; cursor:default; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--ink-soft); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:4px; }

  .case-preview{
    margin-top:14px; padding:14px 16px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line);
  }
  .case-preview .cp-head{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .case-preview h4{ font-size:1.02rem; }
  .case-preview .cp-meta{ font-size:0.74rem; color:var(--muted); margin-top:3px; }
  .case-preview .cp-based{ font-size:0.72rem; color:var(--accent); margin-top:6px; font-style:italic; }

  .note{ font-size:0.78rem; color:var(--muted); line-height:1.5; margin-top:10px; }
  .note.warn-note{ color:var(--warn); }

  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent;
    display:inline-block; animation:spin .7s linear infinite; flex:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- progress dashboard ---- */
  .progress-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  @media(max-width:560px){ .progress-tiles{ grid-template-columns:1fr 1fr; } }
  .progress-tile{ background:var(--surface-2); border-radius:10px; padding:12px 13px; }
  .pt-label{ font-family:"IBM Plex Mono"; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:6px; }
  .pt-value{ font-family:"Libre Baskerville"; font-size:1.4rem; font-weight:700; }
  .pt-of{ font-size:0.85rem; color:var(--muted); font-weight:400; }

  .progress-section{ margin-top:18px; }
  .progress-section:first-of-type{ margin-top:0; }
  .ps-label{ font-family:"IBM Plex Mono"; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin-bottom:10px; }
  .ps-sub{ text-transform:none; letter-spacing:0; color:var(--muted); font-family:"Inter"; font-size:0.74rem; }

  .trend-svg{ width:100%; height:64px; display:block; }
  .trend-line{ fill:none; stroke:var(--accent); stroke-width:1.5; }
  .trend-dot{ fill:var(--accent); }
  .trend-ideal-line{ stroke:var(--ink-soft); stroke-width:0.6; stroke-dasharray:3,3; }

  .cat-list{ display:flex; flex-direction:column; gap:10px; }
  .cat-row{ display:grid; grid-template-columns:120px 1fr 54px auto; align-items:center; gap:10px; }
  @media(max-width:560px){ .cat-row{ grid-template-columns:1fr; gap:6px; } .cat-bar{ order:3; } }
  .cat-main{ min-width:0; }
  .cat-name{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-count{ font-size:0.7rem; color:var(--muted); }

  /* ---- history ---- */
  .hist-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .hist-actions{ display:flex; gap:7px; flex-wrap:wrap; }
  .hist-check{ flex:none; width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
  .hist-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px; border-top:1px solid var(--line); flex-wrap:wrap;
  }
  .hist-row:first-child{ border-top:none; }
  .hist-main{ flex:1 1 160px; min-width:0; }
  .hist-title{ font-weight:600; font-size:0.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hist-sub{ font-size:0.74rem; color:var(--muted); margin-top:1px; }

  .icon-btn{
    flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
    width:30px; height:30px; border-radius:7px; cursor:pointer; font-size:0.86rem;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--bad); color:var(--bad); }
  .confirm-inline{ display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; color:var(--ink-soft); flex-wrap:wrap; }
  .btn-tiny{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-soft); border-radius:7px;
    padding:5px 10px; font-size:0.74rem; font-weight:600; cursor:pointer;
  }
  .btn-tiny:hover{ color:var(--ink); }
  .btn-tiny-danger{ border-color:var(--bad); color:var(--bad); background:var(--bad-bg); }
  .btn-tiny-danger:hover{ filter:brightness(1.05); }
  .btn-tiny:disabled, .btn-tiny-danger:disabled{ opacity:0.5; cursor:default; }
  .chip{ font-family:"IBM Plex Mono"; font-size:0.66rem; font-weight:700; border-radius:999px; padding:3px 9px; flex:none; white-space:nowrap; }
  .chip.diff-Easy{ color:var(--good); background:var(--good-bg); }
  .chip.diff-Medium{ color:var(--warn); background:var(--warn-bg); }
  .chip.diff-Hard{ color:var(--bad); background:var(--bad-bg); }
  .chip.rate-Strong-Hire, .chip.rate-Hire{ color:var(--good); background:var(--good-bg); }
  .chip.rate-Lean-Hire{ color:var(--warn); background:var(--warn-bg); }
  .chip.rate-No-Hire{ color:var(--bad); background:var(--bad-bg); }
  .empty-note{ color:var(--muted); font-size:0.85rem; padding:6px 2px; }

  /* ---- live session ---- */
  .session-top{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bg);
    padding:10px 0 12px; border-bottom:1px solid var(--line); margin-bottom:14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .timer-box{ display:flex; flex-direction:column; gap:1px; }
  .timer-box .tb-label{ font-family:"IBM Plex Mono"; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .timer-box .tb-value{ font-family:"IBM Plex Mono"; font-size:1.1rem; font-weight:600; }
  .think-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:8px;
    padding:7px 12px; cursor:pointer; font-size:0.78rem; font-weight:700; display:flex; align-items:center; gap:6px;
  }
  .think-btn.active{ background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
  .think-btn .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .session-top-spacer{ flex:1; }
  .end-btn{ background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad); border-radius:8px; padding:7px 13px; font-size:0.78rem; font-weight:700; cursor:pointer; }

  .phase-row{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .phase-pill{
    flex:1 1 100px; text-align:center; padding:7px 4px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:0.72rem; font-weight:700;
  }
  .phase-pill.done{ color:var(--ink-soft); background:var(--surface-2); }
  .phase-pill.current{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .phase-next{ display:flex; justify-content:flex-end; margin-bottom:18px; }

  .case-card{ border-left:3px solid var(--accent); padding:14px 16px; background:var(--accent-soft); border-radius:0 10px 10px 0; margin-bottom:18px; }
  .case-card .cc-meta{ font-family:"IBM Plex Mono"; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--accent); margin-bottom:6px; }
  .case-card p{ margin:0; font-family:"Libre Baskerville"; font-size:1.08rem; font-style:italic; line-height:1.5; color:var(--ink); }

  .transcript{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .bubble{ max-width:82%; padding:10px 14px; border-radius:14px; font-size:0.88rem; line-height:1.5; }
  .bubble.interviewer{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble.candidate{ align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .bubble .b-role{ font-family:"IBM Plex Mono"; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.05em; opacity:0.65; margin-bottom:4px; }
  .bubble-wait{ align-self:flex-start; display:flex; align-items:center; gap:7px; color:var(--muted); font-size:0.8rem; padding:4px 14px; }

  .compose{ display:flex; gap:8px; align-items:flex-end; position:sticky; bottom:env(safe-area-inset-bottom, 0px); background:var(--bg); padding:10px 0 4px; }
  .compose textarea{ flex:1; min-height:46px; max-height:160px; resize:vertical; }
  .speaker-toggle{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:8px;
    width:40px; height:40px; cursor:pointer; flex:none; font-size:1rem;
  }
  .speaker-toggle.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .speaker-toggle.mic-live{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad); animation:mic-pulse 1.4s ease-in-out infinite; }
  @keyframes mic-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(177,64,47,0.35); } 50%{ box-shadow:0 0 0 6px rgba(177,64,47,0); } }
  .compose-note{ font-size:0.74rem; color:var(--muted); line-height:1.5; padding:0 0 10px; }
  .compose-note b{ color:var(--ink-soft); }
  .send-btn{ flex:none; height:40px; }

  /* ---- evaluation ---- */
  .rate-badge{
    display:inline-flex; align-items:center; gap:7px; padding:7px 16px; border-radius:999px; font-weight:700; font-size:0.95rem;
  }
  .rate-badge.rate-Strong-Hire, .rate-badge.rate-Hire{ color:var(--good); background:var(--good-bg); }
  .rate-badge.rate-Lean-Hire{ color:var(--warn); background:var(--warn-bg); }
  .rate-badge.rate-No-Hire{ color:var(--bad); background:var(--bad-bg); }

  .overall-hero{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:16px 0 6px; }
  .oh-score{ display:flex; align-items:baseline; gap:4px; }
  .oh-num{ font-family:"Libre Baskerville"; font-size:2.6rem; font-weight:700; line-height:1; }
  .oh-of{ font-size:1rem; color:var(--muted); }
  .oh-meta{ display:flex; flex-direction:column; gap:5px; align-items:flex-start; }
  .oh-ideal{ font-size:0.76rem; color:var(--muted); }
  .standing-note{ font-size:0.86rem; color:var(--ink-soft); margin:4px 0 16px; line-height:1.5; }

  .rubric-table{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .rubric-row{ display:grid; grid-template-columns:104px 1fr 54px 64px; align-items:center; gap:10px; }
  @media(max-width:520px){ .rubric-row{ grid-template-columns:84px 1fr 44px 56px; gap:7px; } }
  .rubric-label{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); }
  .rubric-value{ font-size:0.86rem; font-weight:600; text-align:right; }
  .rv-of{ font-size:0.7rem; color:var(--muted); font-weight:400; }
  .rubric-gap{ font-size:0.74rem; text-align:right; white-space:nowrap; }

  .gap-track{ position:relative; height:8px; border-radius:99px; background:var(--surface-2); overflow:visible; }
  .gap-fill{ position:absolute; left:0; top:0; height:100%; border-radius:99px; background:var(--accent); }
  .gap-fill.gap-good{ background:var(--good); }
  .gap-fill.gap-warn{ background:var(--warn); }
  .gap-fill.gap-bad{ background:var(--bad); }
  .gap-ideal{ position:absolute; top:-3px; width:2px; height:14px; background:var(--ink-soft); border-radius:1px; }
  .rubric-gap.gap-good{ color:var(--good); }
  .rubric-gap.gap-warn{ color:var(--warn); }
  .rubric-gap.gap-bad{ color:var(--bad); }

  .eval-summary{ font-size:0.92rem; line-height:1.6; color:var(--ink-soft); margin:14px 0; }
  .eval-lists{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:6px; }
  @media(max-width:560px){ .eval-lists{ grid-template-columns:1fr; } }
  .eval-list h5{ font-size:0.86rem; margin-bottom:9px; }
  .eval-list.strengths h5{ color:var(--good); }
  .eval-list.improve h5{ color:var(--warn); }
  .eval-list ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
  .eval-list li{ font-size:0.84rem; color:var(--ink-soft); padding-left:18px; position:relative; line-height:1.45; }
  .eval-list.strengths li::before{ content:"✓"; position:absolute; left:0; color:var(--good); font-weight:700; }
  .eval-list.improve li::before{ content:"→"; position:absolute; left:0; color:var(--warn); font-weight:700; }

  .time-row{ display:flex; gap:18px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .time-stat{ display:flex; flex-direction:column; gap:2px; }
  .time-stat .ts-label{ font-family:"IBM Plex Mono"; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
  .time-stat .ts-value{ font-family:"IBM Plex Mono"; font-size:1rem; font-weight:600; }

  details.transcript-fold{ margin-top:16px; }
  details.transcript-fold summary{ cursor:pointer; font-size:0.82rem; font-weight:700; color:var(--accent); padding:6px 0; }
  details.transcript-fold .transcript{ margin-top:10px; }

  [hidden]{ display:none !important; }

  @media(max-width:480px){
    .field-row{ flex-direction:column; }
    .bubble{ max-width:92%; }
  }
</style>

</head>
<body>
<div class="shell" id="app"></div>

<script>
(function(){
  'use strict';

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtTime(ms){
    const total = Math.max(0, Math.floor(ms/1000));
    const m = Math.floor(total/60), s = total%60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function relDate(ts){
    const diff = Date.now() - ts;
    const day = 86400000;
    if(diff < 3600000) return Math.max(1, Math.round(diff/60000)) + 'm ago';
    if(diff < day) return Math.round(diff/3600000) + 'h ago';
    if(diff < day*7) return Math.round(diff/day) + 'd ago';
    return new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }
  function uid(){ return 'att_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40); }

  const PHASES = ['Clarify','Structure','Analyze','Recommend'];
  const DIFFS = ['Easy','Medium','Hard'];

  // same weights as the SACN rubric in the Casebook Index's Guesstimate Cheat
  // Sheet (Structure 40% / Assumptions 30% / Communication 20% / Number Sense
  // 10%), so a score here means the same thing it does there
  const RUBRIC_AXES = [['structure','Structure'],['assumptions','Assumptions'],['communication','Communication'],['numberSense','Number Sense']];
  const OVERALL_WEIGHTS = {structure:0.4, assumptions:0.3, communication:0.2, numberSense:0.1};
  const IDEAL_SCORE = 8.5; // the bar a Strong Hire performance clears, on every axis and overall

  // computed from the AI's per-axis ratings rather than asked for directly, so
  // the overall number and tier can never disagree with the axis scores
  function computeOverall(ratings){
    if(!ratings) return null;
    let sum = 0, wsum = 0;
    RUBRIC_AXES.forEach(([k]) => {
      const v = Number(ratings[k]);
      if(Number.isFinite(v)){ sum += v*OVERALL_WEIGHTS[k]; wsum += OVERALL_WEIGHTS[k]; }
    });
    if(wsum === 0) return null;
    return Math.round((sum/wsum)*10)/10;
  }
  function tierForScore(score){
    if(score == null) return '';
    if(score >= 8.5) return 'Strong Hire';
    if(score >= 7.0) return 'Hire';
    if(score >= 5.5) return 'Lean Hire';
    return 'No Hire';
  }
  function gapClass(gap){ return gap<=0 ? 'good' : gap<=1.5 ? 'warn' : 'bad'; }

  function diffBucket(d){
    if(!d) return null;
    if(/easy/i.test(d) && !/moderate|challen|hard/i.test(d)) return 'Easy';
    if(/very challenging|hard$|^hard/i.test(d)) return 'Hard';
    if(/challenging/i.test(d) && !/moderate/i.test(d)) return 'Hard';
    if(/moderate-hard|moderate-challenging/i.test(d)) return 'Hard';
    if(/moderate/i.test(d)) return 'Medium';
    return null;
  }
  function difficultyNote(d){
    if(d==='Easy') return 'be forthcoming with data when asked, keep the path fairly linear, go easy on curveballs';
    if(d==='Hard') return 'be terse and make the candidate work for each number, include at least one real curveball or pushback moment, expect sharp number sense and tight structure';
    return 'moderate ambiguity, give data once a clarifying question earns it, one mild follow-up challenge partway through';
  }

  // ---- app state ----
  let CASES = [], INSTITUTES = [], CATEGORIES = [];
  let view = 'home';
  let theme = null;
  let history = [];
  let historyLoading = true;
  let historyBusy = false;
  let historyDetail = null;
  let confirmDeleteId = null;
  let confirmClearAll = false;
  let selectMode = false;
  let selectedIds = new Set();
  let downloadBusy = false;
  let downloadNote = null;

  let setup = {
    source: 'book',     // 'book' | 'ai-new' | 'ai-remix'
    institute: 'any',
    category: 'any',
    sectorHint: '',
    difficulty: 'Medium',
    pickedCase: null,   // {title, firm, sector, difficulty, prompt, source, bookId, basedOn}
    busy: false,
    error: null,
  };

  let session = null;
  let ttsEnabled = false;
  let speechSupported = (typeof window.speechSynthesis !== 'undefined');
  let apiKeyVisible = false;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micSupported = !!SpeechRecognitionCtor;
  let micActive = false;
  let recognition = null;

  let tickHandle = null;

  const app = document.getElementById('app');

  // ---- theme ----
  function setTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    try{ localStorage.setItem('caseroom_theme', t); }catch(e){}
    render();
  }
  try{
    const saved = localStorage.getItem('caseroom_theme');
    if(saved){ theme = saved; document.documentElement.setAttribute('data-theme', saved); }
  }catch(e){}

  // ---- data load ----
  async function loadData(){
    const [c, i, cat] = await Promise.all([
      fetch('cases.json').then(r=>r.json()),
      fetch('institutes.json').then(r=>r.json()),
      fetch('categories.json').then(r=>r.json()),
    ]);
    CASES = c; INSTITUTES = i; CATEGORIES = cat;
  }

  function instName(id){ const f = INSTITUTES.find(x=>x.id===id); return f ? f.name : id; }

  // ---- AI backend: /api/chat proxies to whichever free-tier provider is selected ----
  const PROVIDERS = [
    {id:'gemini', name:'Google Gemini', placeholder:'AIzaSy...', keyUrl:'aistudio.google.com/apikey'},
    {id:'groq', name:'Groq', placeholder:'gsk_...', keyUrl:'console.groq.com/keys'},
    {id:'openrouter', name:'OpenRouter (free models)', placeholder:'sk-or-v1-...', keyUrl:'openrouter.ai/keys'},
  ];
  let aiProvider = 'gemini';
  try{ aiProvider = localStorage.getItem('caseroom_provider') || 'gemini'; }catch(e){}
  if(!PROVIDERS.find(p => p.id === aiProvider)) aiProvider = 'gemini';

  let providerKeys = {};
  try{ providerKeys = JSON.parse(localStorage.getItem('caseroom_keys') || '{}'); }catch(e){ providerKeys = {}; }

  // userApiKey always mirrors providerKeys[aiProvider] — kept as a plain
  // variable (not a function) since most call sites below read it directly
  let userApiKey = providerKeys[aiProvider] || '';

  function saveApiKey(key){
    providerKeys[aiProvider] = (key||'').trim();
    userApiKey = providerKeys[aiProvider];
    try{ localStorage.setItem('caseroom_keys', JSON.stringify(providerKeys)); }catch(e){}
  }
  function clearApiKey(){
    delete providerKeys[aiProvider];
    userApiKey = '';
    try{ localStorage.setItem('caseroom_keys', JSON.stringify(providerKeys)); }catch(e){}
  }
  function setProvider(id){
    if(!PROVIDERS.find(p => p.id === id)) return;
    aiProvider = id;
    userApiKey = providerKeys[aiProvider] || '';
    try{ localStorage.setItem('caseroom_provider', id); }catch(e){}
  }

  async function callClaudeRaw(messages, opts){
    opts = opts || {};
    if(!userApiKey) throw {code:'no_api_key', message:'Add your API key for ' + PROVIDERS.find(p=>p.id===aiProvider).name + ' first.'};
    let res;
    try{
      res = await fetch('/api/chat', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({apiKey:userApiKey, provider:aiProvider, messages, tier:opts.modelTier||'default', maxTokens:opts.maxTokens||1024}),
      });
    }catch(e){ throw {code:'network_error', message:'Could not reach the server.'}; }
    let payload;
    try{ payload = await res.json(); }catch(e){ payload = null; }
    if(!res.ok){
      throw {code:(payload&&payload.error)||'upstream_error', message:(payload&&payload.message)||('Request failed ('+res.status+')')};
    }
    return payload.text;
  }

  function parseJsonTolerant(text){
    try{ return JSON.parse(text); }catch(e){}
    const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if(fence){ try{ return JSON.parse(fence[1]); }catch(e){} }
    const start = text.search(/[\{\[]/);
    const end = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
    if(start !== -1 && end > start){ try{ return JSON.parse(text.slice(start, end+1)); }catch(e){} }
    throw {code:'invalid_json', message:'Could not parse a JSON reply from the model.', text};
  }

  // drop-in replacements for the two call shapes used throughout this file:
  // sampleApi(turns, opts) -> {text}, and sampleApi.json(prompt, opts) -> parsed value
  async function sampleApi(input, opts){
    const messages = Array.isArray(input) ? input : [{role:'user', content:String(input)}];
    const text = await callClaudeRaw(messages, opts);
    return {text, truncated:false};
  }
  sampleApi.json = async function(input, opts){
    const messages = Array.isArray(input) ? input : [{role:'user', content:String(input)}];
    const text = await callClaudeRaw(messages, opts);
    return parseJsonTolerant(text);
  };

  // ---- history: plain localStorage, no account/sign-in needed ----
  const dbReady = true;
  const HISTORY_KEY = 'caseroom_history';

  function readHistoryStore(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }catch(e){ return []; }
  }
  function writeHistoryStore(arr){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); return true; }catch(e){ return false; }
  }

  // ---- downloads: a plain Blob + <a download>, no permission step needed outside the artifact sandbox ----
  const downloadsApi = {
    save: async ({filename, data}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return {status:'saved'};
    },
  };

  async function initCapabilities(){
    history = readHistoryStore();
    historyLoading = false;
    render();
  }

  async function loadHistory(){
    history = readHistoryStore();
    historyLoading = false;
    render();
  }

  // ---- random/filtered case pool ----
  function filteredPool(){
    let pool = CASES;
    if(setup.institute !== 'any') pool = pool.filter(c => c.s === setup.institute);
    if(setup.category !== 'any') pool = pool.filter(c => c.c === setup.category);
    const strict = pool.filter(c => diffBucket(c.d) === setup.difficulty);
    if(strict.length) return strict;
    return pool.length ? pool : CASES;
  }

  function pickRandomBookCase(){
    const pool = filteredPool();
    const c = pool[Math.floor(Math.random()*pool.length)];
    setup.pickedCase = {
      title: c.t, firm: c.f || 'Unnamed firm', sector: c.x || c.c, difficulty: setup.difficulty,
      prompt: c.q, source: 'book', bookId: c.id, bookInst: instName(c.s), bookCategory: c.c,
    };
    setup.error = null;
    render();
  }

  // ---- AI generation ----
  async function generateNewCase(){
    if(!userApiKey){ setup.error = 'Add your API key above first.'; render(); return; }
    setup.busy = true; setup.error = null; render();
    const cat = setup.category === 'any' ? CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)] : setup.category;
    const sectorBit = setup.sectorHint.trim() ? ` set in or around the "${setup.sectorHint.trim()}" sector` : '';
    const prompt = `Write a brand-new MBB-style consulting case opening, in the category "${cat}"${sectorBit}. Difficulty: ${setup.difficulty} — ${difficultyNote(setup.difficulty)}.\n\nReturn ONLY JSON, no markdown, matching exactly: {"title":"short case name","firm":"a plausible interviewing firm, vary it across McKinsey/Bain/BCG/Kearney/EY-Parthenon/Deloitte/Strategy&/LEK/Oliver Wyman/Accenture","sector":"industry in a few words","prompt":"the case opening as an interviewer would say it out loud to a candidate — 2-4 sentences, a client situation plus a clear question, no solution hints, no markdown"}`;
    try{
      const result = await sampleApi.json(prompt, {modelTier:'complex', cache:false});
      setup.pickedCase = {
        title: result.title, firm: result.firm, sector: result.sector, difficulty: setup.difficulty,
        prompt: result.prompt, source: 'ai-new', category: cat,
      };
    }catch(e){
      setup.error = 'Case generation failed (' + (e && e.code ? e.code : 'error') + '). Try again.';
    }
    setup.busy = false; render();
  }

  async function remixCase(){
    if(!userApiKey){ setup.error = 'Add your API key above first.'; render(); return; }
    const pool = filteredPool();
    const base = pool[Math.floor(Math.random()*pool.length)];
    setup.busy = true; setup.error = null; render();
    const prompt = `Here is a real case from a student consulting casebook:\nTitle: ${base.t}\nCategory: ${base.c}\nSector: ${base.x || 'unspecified'}\nOriginal opening: """${base.q}"""\n\nWrite a FRESH variant that exercises the same underlying case-type skill but changes the company, sector, or specific twist so it feels new — build on the original rather than reusing it outright. Difficulty: ${setup.difficulty} — ${difficultyNote(setup.difficulty)}.\n\nReturn ONLY JSON, no markdown, matching exactly: {"title":"short case name","firm":"a plausible interviewing firm","sector":"industry in a few words","prompt":"the case opening as an interviewer would say it out loud — 2-4 sentences, no solution hints, no markdown"}`;
    try{
      const result = await sampleApi.json(prompt, {modelTier:'complex', cache:false});
      setup.pickedCase = {
        title: result.title, firm: result.firm, sector: result.sector, difficulty: setup.difficulty,
        prompt: result.prompt, source: 'ai-remix', category: base.c, basedOn: base.t,
      };
    }catch(e){
      setup.error = 'Remix failed (' + (e && e.code ? e.code : 'error') + '). Try again.';
    }
    setup.busy = false; render();
  }

  // ---- session lifecycle ----
  function startSession(){
    if(!setup.pickedCase) return;
    const opening = pickOpeningLine();
    session = {
      id: uid(),
      case: setup.pickedCase,
      difficulty: setup.pickedCase.difficulty,
      startedAt: Date.now(),
      endedAt: null,
      transcript: [{role:'interviewer', text: opening, ts: Date.now()}],
      phase: 0,
      phaseStart: Date.now(),
      phaseElapsed: [0,0,0,0],
      thinking: {active:false, startedAt:null, totalMs:0},
      busy: false,
      evaluation: null,
      evalBusy: false,
      evalError: null,
      saved: false,
    };
    view = 'session';
    startTicking();
    render();
    speak(opening);
  }

  function pickOpeningLine(){
    const lines = [
      "Take a moment to think, then walk me through how you'd structure this.",
      "Go ahead whenever you're ready — how would you approach this?",
      "Feel free to ask a few clarifying questions before you dive in.",
    ];
    return lines[Math.floor(Math.random()*lines.length)];
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(() => {
      if(view === 'session') renderTimers();
    }, 1000);
  }
  function stopTicking(){ if(tickHandle){ clearInterval(tickHandle); tickHandle = null; } }

  function toggleThinking(){
    if(!session) return;
    const t = session.thinking;
    if(t.active){
      t.totalMs += Date.now() - t.startedAt;
      t.active = false; t.startedAt = null;
    } else {
      t.active = true; t.startedAt = Date.now();
    }
    render();
  }

  function advancePhase(){
    if(!session || session.phase >= PHASES.length-1) return;
    const now = Date.now();
    session.phaseElapsed[session.phase] += now - session.phaseStart;
    session.phase += 1;
    session.phaseStart = now;
    render();
  }

  function buildPreamble(){
    const c = session.case;
    return `You are role-playing as a live case interviewer at a top consulting firm, talking out loud in real time — not writing. Stay strictly in character; never mention you are an AI or break the fourth wall.\n\nCASE OPENING YOU GAVE THE CANDIDATE:\n"""${c.prompt}"""\n\nDIFFICULTY: ${session.difficulty} — ${difficultyNote(session.difficulty)}\n\nRULES:\n- Do not solve the case or reveal a "correct" structure. Let the candidate lead.\n- Answer reasonable clarifying questions with a short, specific, plausible detail (invent consistent numbers/facts as needed and stay consistent with anything you've already told them in this conversation).\n- If a structure is stated, acknowledge briefly and let them proceed; if it's badly off-track, nudge with a brief question instead of lecturing.\n- If they ask for data to calculate something, give clean, usable numbers.\n- Occasionally add a realistic curveball, deflection, or follow-up challenge — more often at Hard, rarely at Easy.\n- Keep every reply SHORT: 1-4 sentences of natural spoken dialogue. No markdown, no bullet lists, no headers.\n- SOUND LIKE A PERSON TALKING, not a report. Use contractions (that's, you'd, let's), the odd small acknowledgment before you answer ("Sure.", "Good question.", "Okay, so—"), and vary sentence length like real speech does. Avoid stiff transitions ("Furthermore", "In conclusion", "It is worth noting") and avoid restating the candidate's question back formally before answering — just answer it, the way a person would across a table.`;
  }

  function buildTurns(){
    const msgs = session.transcript;
    const startIdx = msgs.findIndex(m => m.role === 'candidate');
    if(startIdx === -1) return null;
    const relevant = msgs.slice(startIdx);
    const preamble = buildPreamble();
    return relevant.map((m,i) => {
      if(m.role === 'candidate'){
        const content = i===0 ? preamble + '\n\nCandidate: ' + m.text : m.text;
        return {role:'user', content};
      }
      return {role:'assistant', content:m.text};
    });
  }

  async function sendCandidateMessage(text){
    text = text.trim();
    if(!text || !session || session.busy) return;
    if(micActive) stopMic();
    session.transcript.push({role:'candidate', text, ts:Date.now()});
    session.busy = true;
    render();
    if(!userApiKey){
      session.transcript.push({role:'interviewer', text:"(No API key set — add one from the home screen to talk to the interviewer.)", ts:Date.now()});
      session.busy = false; render(); return;
    }
    try{
      const turns = buildTurns();
      const reply = await sampleApi(turns, {modelTier:'default', cache:false});
      const replyText = (reply.text || '...').trim();
      session.transcript.push({role:'interviewer', text: replyText, ts:Date.now()});
      speak(replyText);
    }catch(e){
      session.transcript.push({role:'interviewer', text:"(Couldn't reach the interviewer model just now — try sending again.)", ts:Date.now()});
    }
    session.busy = false;
    render();
  }

  // voices load async in most browsers; cache the list and re-pick when it fires
  let cachedVoices = [];
  function refreshVoices(){
    try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){ cachedVoices = []; }
  }
  if(speechSupported){
    refreshVoices();
    try{ window.speechSynthesis.onvoiceschanged = refreshVoices; }catch(e){}
  }

  // the default voice on most browsers/OSes is the flattest one available;
  // prefer a natural-sounding English voice when the device offers one
  const PREFERRED_VOICE_NAMES = [
    'Google US English', 'Microsoft Aria Online (Natural)', 'Microsoft Guy Online (Natural)',
    'Microsoft Jenny Online (Natural)', 'Samantha', 'Daniel', 'Microsoft Zira', 'Microsoft David',
  ];
  function pickVoice(){
    if(!cachedVoices.length) return null;
    for(const name of PREFERRED_VOICE_NAMES){
      const hit = cachedVoices.find(v => v.name === name);
      if(hit) return hit;
    }
    const natural = cachedVoices.find(v => /en(-|_)(US|GB)/i.test(v.lang) && !v.localService);
    if(natural) return natural;
    const anyEn = cachedVoices.find(v => /^en/i.test(v.lang));
    return anyEn || cachedVoices[0];
  }

  function speak(text){
    if(!ttsEnabled || !speechSupported) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const voice = pickVoice();
      if(voice) u.voice = voice;
      u.rate = 0.97;   // the default reads a hair fast and flat; this lands closer to natural speech
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---- mic dictation: real getUserMedia-based speech-to-text, only possible
  // because this page runs as a normal website, not inside the artifact sandbox ----
  function startMic(){
    if(!micSupported || micActive) return;
    const input = document.getElementById('composeInput');
    if(!input) return;
    const baseText = input.value ? input.value.replace(/\s+$/, '') + ' ' : '';
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (e) => {
      let finalText = '', interimText = '';
      for(let i = 0; i < e.results.length; i++){
        const r = e.results[i];
        if(r.isFinal) finalText += r[0].transcript;
        else interimText += r[0].transcript;
      }
      input.value = baseText + finalText + interimText;
    };
    recognition.onerror = () => { micActive = false; render(); };
    recognition.onend = () => { micActive = false; render(); };
    try{
      recognition.start();
      micActive = true;
      render();
    }catch(e){ micActive = false; }
  }
  function stopMic(){
    if(recognition){ try{ recognition.stop(); }catch(e){} }
    micActive = false;
  }
  function toggleMic(){ micActive ? stopMic() : startMic(); }

  async function endSession(){
    if(!session) return;
    const now = Date.now();
    session.phaseElapsed[session.phase] += now - session.phaseStart;
    if(session.thinking.active){ session.thinking.totalMs += now - session.thinking.startedAt; session.thinking.active = false; }
    session.endedAt = now;
    stopTicking();
    view = 'eval';
    render();
    await runEvaluation();
  }

  async function runEvaluation(){
    session.evalBusy = true; session.evalError = null; render();
    if(!userApiKey){
      session.evalError = 'No API key set — add one from the home screen to get scored.';
      session.evalBusy = false; render(); return;
    }
    const transcriptText = session.transcript.map(m => (m.role==='candidate'?'Candidate: ':'Interviewer: ') + m.text).join('\n');
    const totalMs = session.endedAt - session.startedAt;
    const prompt = `You are grading a completed case interview as a strict but fair MBB interviewer, after the fact.\n\nCASE: """${session.case.prompt}"""\nDIFFICULTY: ${session.difficulty}\n\nFULL TRANSCRIPT:\n${transcriptText}\n\nTIMING: total ${fmtTime(totalMs)}, thinking time ${fmtTime(session.thinking.totalMs)}.\n\nScore the candidate 0-10 (decimals allowed, e.g. 7.5) on each: Structure, Assumptions, Communication, Number Sense. Score against a real MBB bar, not a generous classroom curve — 8.5+ is a genuinely strong, close-to-ideal performance on that axis, not the default for a reasonable attempt.\n\nReturn ONLY JSON, no markdown, matching exactly: {"ratings":{"structure":0,"assumptions":0,"communication":0,"numberSense":0},"summary":"2-3 sentence overall take on this specific performance","strengths":["specific to this transcript",".."],"improvements":["specific to this transcript",".."]}\nGive 2-5 items each for strengths/improvements, grounded in what actually happened, not generic advice.`;
    try{
      const result = await sampleApi.json(prompt, {modelTier:'complex'});
      const overallScore = computeOverall(result.ratings);
      session.evaluation = Object.assign({}, result, {overallScore, overall: tierForScore(overallScore)});
      await saveAttempt();
    }catch(e){
      session.evalError = 'Evaluation failed (' + (e && e.code ? e.code : 'error') + '). Your transcript is still below.';
    }
    session.evalBusy = false; render();
  }

  async function saveAttempt(){
    if(!dbReady || !session.evaluation || session.saved) return;
    const doc = {
      caseTitle: session.case.title, caseFirm: session.case.firm, caseSector: session.case.sector,
      casePrompt: session.case.prompt,
      caseSource: session.case.source, caseCategory: session.case.category || session.case.bookCategory || '',
      basedOn: session.case.basedOn || null,
      difficulty: session.difficulty,
      startedAt: session.startedAt, endedAt: session.endedAt,
      totalMs: session.endedAt - session.startedAt,
      thinkingMs: session.thinking.totalMs,
      phaseElapsed: session.phaseElapsed,
      transcript: session.transcript,
      evaluation: session.evaluation,
      createdAt: Date.now(),
    };
    try{
      const record = Object.assign({_id: session.id}, doc);
      const store = readHistoryStore();
      store.unshift(record);
      writeHistoryStore(store);
      session.saved = true;
      history.unshift(record);
    }catch(e){ /* non-fatal: attempt stays visible in-session even if save fails */ }
  }

  function backToHome(){
    stopTicking();
    session = null;
    setup.pickedCase = null;
    setup.error = null;
    confirmDeleteId = null;
    confirmClearAll = false;
    selectMode = false;
    selectedIds = new Set();
    downloadNote = null;
    view = 'home';
    render();
  }

  function openHistoryDetail(id){
    const item = history.find(h => h._id === id);
    if(!item) return;
    historyDetail = item;
    view = 'historyDetail';
    confirmDeleteId = null;
    downloadNote = null;
    render();
  }

  async function deleteAttempt(id){
    if(!dbReady || historyBusy) return;
    historyBusy = true; render();
    try{
      writeHistoryStore(readHistoryStore().filter(h => h._id !== id));
      history = history.filter(h => h._id !== id);
      if(view === 'historyDetail' && historyDetail && historyDetail._id === id){
        view = 'home'; historyDetail = null;
      }
    }catch(e){ /* leave history as-is; the row stays so the viewer can retry */ }
    confirmDeleteId = null;
    historyBusy = false;
    render();
  }

  function renderTimers(){
    if(!session) return;
    const totalEl = app.querySelector('[data-timer="total"]');
    const thinkEl = app.querySelector('[data-timer="think"]');
    if(totalEl) totalEl.textContent = fmtTime(Date.now() - session.startedAt);
    if(thinkEl){

    }

  // ---- progress dashboard ----
  function progressStats(){
    const scored = history.filter(h => h.evaluation && h.evaluation.overallScore != null);
    if(!scored.length) return null;

    const scores = scored.map(h => h.evaluation.overallScore);
    const avg = scores.reduce((a,b)=>a+b, 0) / scores.length;
    const best = Math.max(...scores);

    const axisSums = {}, axisCounts = {};
    RUBRIC_AXES.forEach(([k]) => { axisSums[k]=0; axisCounts[k]=0; });
    scored.forEach(h => RUBRIC_AXES.forEach(([k]) => {
      const v = h.evaluation.ratings && h.evaluation.ratings[k];
      if(v != null){ axisSums[k] += v; axisCounts[k] += 1; }
    }));
    const axisAvgs = {};
    RUBRIC_AXES.forEach(([k]) => { axisAvgs[k] = axisCounts[k] ? axisSums[k]/axisCounts[k] : null; });
    let weakest = null;
    RUBRIC_AXES.forEach(([k,label]) => {
      if(axisAvgs[k] != null && (weakest == null || axisAvgs[k] < weakest.avg)) weakest = {key:k, label, avg:axisAvgs[k]};
    });

    const catMap = {};
    scored.forEach(h => {
      const cat = h.caseCategory || 'Uncategorized';
      if(!catMap[cat]) catMap[cat] = {count:0, sum:0};
      catMap[cat].count += 1; catMap[cat].sum += h.evaluation.overallScore;
    });
    const catBreakdown = Object.keys(catMap)
      .map(cat => ({cat, count:catMap[cat].count, avg:catMap[cat].sum/catMap[cat].count}))
      .sort((a,b) => a.avg-b.avg);

    const trend = scored.slice().sort((a,b) => a.createdAt-b.createdAt).map(h => ({score:h.evaluation.overallScore, date:h.createdAt}));

    return {count:scored.length, avg, best, axisAvgs, weakest, catBreakdown, trend};
  }

  function trendSparkline(trend){
    const w = 200, h = 56, pad = 4;
    const n = trend.length;
    const x = i => n<=1 ? w/2 : pad + (i/(n-1))*(w-2*pad);
    const y = v => pad + (1 - v/10)*(h-2*pad);
    const points = trend.map((t,i) => `${x(i).toFixed(1)},${y(t.score).toFixed(1)}`).join(' ');
    const idealY = y(IDEAL_SCORE).toFixed(1);
    const dots = trend.map((t,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(t.score).toFixed(1)}" r="2.6" class="trend-dot"><title>${esc(new Date(t.date).toLocaleDateString())}: ${t.score.toFixed(1)}/10</title></circle>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" class="trend-svg" preserveAspectRatio="none" role="img" aria-label="Overall score trend across your interviews, with the ${IDEAL_SCORE}/10 ideal line">
        <line x1="${pad}" y1="${idealY}" x2="${w-pad}" y2="${idealY}" class="trend-ideal-line"/>
        <polyline points="${points}" class="trend-line"/>
        ${dots}
      </svg>`;
  }

  function progressDashboardHtml(){
    if(!dbReady) return `<div class="empty-note" style="margin-top:8px;">Sign-in isn't available in this view, so progress isn't tracked here.</div>`;
    if(historyLoading) return `<div class="empty-note" style="margin-top:8px;"><span class="spinner"></span> Loading…</div>`;
    const stats = progressStats();
    if(!stats) return `<div class="empty-note" style="margin-top:8px;">Complete your first interview to start tracking progress — your score trend and weak spots will show up here.</div>`;

    const statTiles = `<div class="progress-tiles">
        <div class="progress-tile"><div class="pt-label">Interviews</div><div class="pt-value mono">${stats.count}</div></div>
        <div class="progress-tile"><div class="pt-label">Average score</div><div class="pt-value mono">${stats.avg.toFixed(1)}<span class="pt-of">/10</span></div></div>
        <div class="progress-tile"><div class="pt-label">Best score</div><div class="pt-value mono">${stats.best.toFixed(1)}<span class="pt-of">/10</span></div></div>
        <div class="progress-tile"><div class="pt-label">Weakest axis</div><div class="pt-value" style="font-size:1.1rem;">${stats.weakest?esc(stats.weakest.label):'—'}</div></div>
      </div>`;

    const axisRows = RUBRIC_AXES.map(([k,label]) => {
      const v = stats.axisAvgs[k];
      const gap = v!=null ? Math.max(0, IDEAL_SCORE-v) : null;
      const fillPct = v!=null ? Math.max(0, Math.min(100, v*10)) : 0;
      const idealPct = IDEAL_SCORE*10;
      return `<div class="rubric-row">
          <div class="rubric-label">${esc(label)}</div>
          <div class="gap-track"><div class="gap-fill gap-${v!=null?gapClass(gap):''}" style="width:${fillPct}%"></div><div class="gap-ideal" style="left:${idealPct}%"></div></div>
          <div class="rubric-value mono">${v!=null?v.toFixed(1):'—'}<span class="rv-of">/10</span></div>
          <div class="rubric-gap mono gap-${v!=null?gapClass(gap):''}">${v==null?'':(gap<=0?'At ideal':'−'+gap.toFixed(1))}</div>
        </div>`;
    }).join('');

    const catRows = stats.catBreakdown.map(c => `<div class="cat-row">
        <div class="cat-main"><div class="cat-name">${esc(c.cat)}</div><div class="cat-count">${c.count} interview${c.count===1?'':'s'}</div></div>
        <div class="gap-track cat-bar"><div class="gap-fill gap-${gapClass(Math.max(0,IDEAL_SCORE-c.avg))}" style="width:${Math.max(0,Math.min(100,c.avg*10))}%"></div><div class="gap-ideal" style="left:${IDEAL_SCORE*10}%"></div></div>
        <div class="rubric-value mono">${c.avg.toFixed(1)}<span class="rv-of">/10</span></div>
        <button type="button" class="btn btn-ghost" data-practice="${esc(c.cat)}" style="padding:5px 10px;font-size:0.72rem;">Practice this</button>
      </div>`).join('');

    return `${statTiles}
      <div class="progress-section">
        <div class="ps-label">Score trend <span class="ps-sub">oldest → most recent, dashed line is the ${IDEAL_SCORE}/10 ideal</span></div>
        ${trendSparkline(stats.trend)}
      </div>
      <div class="progress-section">
        <div class="ps-label">Average by axis, vs. ideal</div>
        <div class="rubric-table">${axisRows}</div>
      </div>
      <div class="progress-section">
        <div class="ps-label">Average by category <span class="ps-sub">weakest first</span></div>
        <div class="cat-list">${catRows}</div>
      </div>`;
  }

  // ---- exports ----
  function csvCell(v){
    const s = String(v==null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }

  function buildProgressCsv(){
    const headers = ['Date','Case Title','Source','Category','Difficulty','Overall Score','Structure','Assumptions','Communication','Number Sense','Total Time','Thinking Time'];
    const rows = history.slice().sort((a,b) => a.createdAt-b.createdAt).map(h => {
      const ev = h.evaluation || {}; const r = ev.ratings || {};
      return [
        new Date(h.createdAt).toISOString(), h.caseTitle||'', h.caseSource||'', h.caseCategory||'', h.difficulty||'',
        ev.overallScore!=null?ev.overallScore.toFixed(1):'',
        r.structure!=null?r.structure:'', r.assumptions!=null?r.assumptions:'',
        r.communication!=null?r.communication:'', r.numberSense!=null?r.numberSense:'',
        fmtTime(h.totalMs||0), fmtTime(h.thinkingMs||0),
      ];
    });
    return [headers, ...rows].map(row => row.map(csvCell).join(',')).join('\n');
  }

  function buildRecordMarkdown(h){
    const ev = h.evaluation;
    const lines = [];
    lines.push('# ' + h.caseTitle);
    lines.push('');
    lines.push(`${h.caseFirm||''} · ${h.caseSector||''} · ${h.difficulty} · ${new Date(h.createdAt).toLocaleString()}`);
    if(h.basedOn) lines.push(`_Remixed from: "${h.basedOn}"_`);
    lines.push('');
    if(h.casePrompt){ lines.push('## Case prompt'); lines.push(''); lines.push(h.casePrompt); lines.push(''); }
    if(ev){
      lines.push('## Score');
      lines.push('');
      lines.push(`Overall: **${ev.overallScore!=null?ev.overallScore.toFixed(1):'—'} / 10** (${ev.overall||''}) — ideal bar is ${IDEAL_SCORE.toFixed(1)}/10`);
      lines.push('');
      RUBRIC_AXES.forEach(([k,label]) => {
        const v = ev.ratings && ev.ratings[k];
        lines.push(`- ${label}: ${v!=null?Number(v).toFixed(1):'—'}/10`);
      });
      lines.push('');
      if(ev.summary){ lines.push('## Summary'); lines.push(''); lines.push(ev.summary); lines.push(''); }
      if(ev.strengths && ev.strengths.length){ lines.push('## Strengths'); lines.push(''); ev.strengths.forEach(s=>lines.push('- '+s)); lines.push(''); }
      if(ev.improvements && ev.improvements.length){ lines.push('## Work on next'); lines.push(''); ev.improvements.forEach(s=>lines.push('- '+s)); lines.push(''); }
    }
    lines.push(`## Timing`);
    lines.push('');
    lines.push(`Total: ${fmtTime(h.totalMs||0)} · Thinking: ${fmtTime(h.thinkingMs||0)}`);
    lines.push('');
    lines.push('## Full transcript');
    lines.push('');
    (h.transcript||[]).forEach(m => { lines.push(`**${m.role==='candidate'?'You':'Interviewer'}:** ${m.text}`); lines.push(''); });
    return lines.join('\n');
  }

  function filenameFor(h){
    return slug(h.caseTitle||'case') + '-' + new Date(h.createdAt).toISOString().slice(0,10) + '.md';
  }

  async function downloadProgress(){
    if(!downloadsApi || downloadBusy || !history.length) return;
    downloadBusy = true; downloadNote = null; render();
    try{
      await downloadsApi.save({filename:'case-room-progress.csv', data: buildProgressCsv()});
      downloadNote = 'Progress exported.';
    }catch(e){
      downloadNote = e && e.code === 'declined' ? null : 'Download failed — try again.';
    }
    downloadBusy = false; render();
  }

  async function downloadOne(id){
    const h = history.find(x => x._id === id);
    if(!h || !downloadsApi || downloadBusy) return;
    downloadBusy = true; downloadNote = null; render();
    try{
      await downloadsApi.save({filename: filenameFor(h), data: buildRecordMarkdown(h)});
    }catch(e){
      downloadNote = e && e.code === 'declined' ? null : 'Download failed — try again.';
    }
    downloadBusy = false; render();
  }

  async function downloadSelected(){
    const items = history.filter(h => selectedIds.has(h._id));
    if(!items.length || !downloadsApi || downloadBusy) return;
    downloadBusy = true; downloadNote = null; render();
    try{
      if(items.length === 1){
        await downloadsApi.save({filename: filenameFor(items[0]), data: buildRecordMarkdown(items[0])});
      } else {
        const combined = items.slice().sort((a,b)=>a.createdAt-b.createdAt).map(buildRecordMarkdown).join('\n\n---\n\n');
        await downloadsApi.save({filename: `case-room-${items.length}-interviews.md`, data: combined});
      }
      selectMode = false; selectedIds = new Set();
    }catch(e){
      downloadNote = e && e.code === 'declined' ? null : 'Download failed — try again.';
    }
    downloadBusy = false; render();
  }

  function historyHtml(){
    if(!dbReady) return `<div class="empty-note" style="margin-top:8px;">Sign-in isn't available in this view, so past interviews won't be saved or listed here — this session's results still show at the end of the interview.</div>`;
    if(historyLoading) return `<div class="empty-note" style="margin-top:8px;"><span class="spinner"></span> Loading…</div>`;
    if(!history.length) return `<div class="empty-note" style="margin-top:8px;">No interviews yet — run one above and it'll show up here.</div>`;
    return history.map(h => {
      const confirming = confirmDeleteId === h._id;
      const deleteHtml = confirming
        ? `<span class="confirm-inline">Delete? <button type="button" class="btn-tiny btn-tiny-danger" data-delete-confirm="${esc(h._id)}" ${historyBusy?'disabled':''}>Yes</button><button type="button" class="btn-tiny" data-delete-cancel>No</button></span>`
        : `<button type="button" class="icon-btn" data-delete-ask="${esc(h._id)}" title="Delete this interview" aria-label="Delete this interview">🗑</button>`;
      const checkboxHtml = selectMode
        ? `<input type="checkbox" class="hist-check" data-select="${esc(h._id)}" ${selectedIds.has(h._id)?'checked':''} aria-label="Select ${esc(h.caseTitle)}">`
        : '';
      const downloadHtml = downloadsApi && !selectMode
        ? `<button type="button" class="icon-btn" data-download="${esc(h._id)}" title="Download this interview" aria-label="Download this interview" ${downloadBusy?'disabled':''}>⬇</button>`
        : '';
      return `<div class="hist-row">
        ${checkboxHtml}
        <div class="hist-main">
          <div class="hist-title">${esc(h.caseTitle)}</div>
          <div class="hist-sub">${esc(h.caseFirm||'')} · ${relDate(h.createdAt)} · ${fmtTime(h.totalMs||0)}</div>
        </div>
        <span class="chip diff-${esc(h.difficulty)}">${esc(h.difficulty)}</span>
        ${h.evaluation ? `<span class="chip mono rate-${esc((h.evaluation.overall||'').replace(/ /g,'-'))}">${h.evaluation.overallScore!=null?h.evaluation.overallScore.toFixed(1):'—'}/10 · ${esc(h.evaluation.overall||'')}</span>` : ''}
        ${selectMode ? '' : `<button type="button" class="btn btn-ghost" data-history="${esc(h._id)}" style="padding:6px 11px;font-size:0.76rem;">View</button>`}
        ${downloadHtml}
        ${selectMode ? '' : deleteHtml}
      </div>`;
    }).join('');
  }

  function sessionHtml(){
    const c = session.case;
    const transcriptBubbles = session.transcript.map(m => `<div class="bubble ${m.role}">
        <div class="b-role">${m.role==='candidate'?'You':'Interviewer'}</div>${esc(m.text)}
      </div>`).join('') + (session.busy ? `<div class="bubble-wait"><span class="spinner"></span> Interviewer is thinking…</div>` : '');

    const phasePills = PHASES.map((p,i) => `<div class="phase-pill ${i===session.phase?'current':(i<session.phase?'done':'')}">${esc(p)}</div>`).join('');

    return `<div class="session-top">
        <div class="timer-box"><span class="tb-label">Elapsed</span><span class="tb-value mono" data-timer="total">00:00</span></div>
        <button type="button" class="think-btn ${session.thinking.active?'active':''}" data-action="toggle-think">
          <span class="dot"></span> Thinking: <span class="mono" data-timer="think">00:00</span>
        </button>
        <div class="session-top-spacer"></div>
        <button type="button" class="end-btn" data-action="end-session">End &amp; get feedback</button>
      </div>
      <div class="phase-row">${phasePills}</div>
      <div class="phase-next"><button type="button" class="btn btn-ghost" data-action="next-phase" ${session.phase>=PHASES.length-1?'disabled':''}>Next phase: ${esc(PHASES[Math.min(session.phase+1,PHASES.length-1)])} ›</button></div>
      <div class="case-card">
        <div class="cc-meta">${esc(c.firm)} · ${esc(c.sector)} · ${esc(session.difficulty)}</div>
        <p>${esc(c.prompt)}</p>
      </div>
      <div class="transcript">${transcriptBubbles}</div>
      <div class="compose">
        <textarea id="composeInput" placeholder="Type or dictate your response…" ${session.busy?'disabled':''}></textarea>
        ${micSupported ? `<button type="button" class="speaker-toggle ${micActive?'active mic-live':''}" data-action="toggle-mic" title="Dictate your answer">${micActive?'⏺':'🎤'}</button>` : ''}
        ${speechSupported ? `<button type="button" class="speaker-toggle ${ttsEnabled?'active':''}" data-action="toggle-tts" title="Read interviewer lines aloud">🔊</button>` : ''}
        <button type="button" class="btn btn-primary send-btn" data-action="send" ${session.busy?'disabled':''}>Send</button>
      </div>
      <div class="compose-note">
        ${micSupported ? `🎤 dictates your answer into the box — click once to start, again to stop (you can keep editing before you send). ${micActive?'<b>Listening…</b>':''}` : 'Voice dictation isn\'t supported in this browser — try Chrome or Edge.'}
        ${speechSupported ? ` · 🔊 reads the interviewer's replies aloud — currently <b>${ttsEnabled?'on':'off'}</b>.` : ''}
      </div>`;
  }

  function standingSentence(ev){
    if(!ev || ev.overallScore == null) return '';
    if(ev.overallScore >= IDEAL_SCORE) return `At or above the Strong Hire bar (${IDEAL_SCORE.toFixed(1)}/10) overall.`;
    const gaps = RUBRIC_AXES.map(([k,label]) => ({label, gap: IDEAL_SCORE - (ev.ratings && ev.ratings[k]!=null ? ev.ratings[k] : IDEAL_SCORE)})).sort((a,b)=>b.gap-a.gap);
    const weakest = gaps[0];
    const diff = (IDEAL_SCORE - ev.overallScore).toFixed(1);
    if(weakest.gap <= 0.2) return `${diff} points below the Strong Hire bar overall, fairly even across axes.`;
    return `${diff} points below the Strong Hire bar overall, mostly held back by ${weakest.label.toLowerCase()} (${weakest.gap.toFixed(1)} below ideal there).`;
  }

  function rubricHtml(ev){
    const overall = ev.overallScore;
    const tier = ev.overall || tierForScore(overall);
    const rows = RUBRIC_AXES.map(([k,label]) => {
      const v = ev.ratings && ev.ratings[k]!=null ? Number(ev.ratings[k]) : null;
      const gap = v!=null ? Math.max(0, IDEAL_SCORE - v) : null;
      const fillPct = v!=null ? Math.max(0, Math.min(100, v*10)) : 0;
      const idealPct = IDEAL_SCORE*10;
      return `<div class="rubric-row">
          <div class="rubric-label">${esc(label)}</div>
          <div class="gap-track"><div class="gap-fill gap-${v!=null?gapClass(gap):''}" style="width:${fillPct}%"></div><div class="gap-ideal" style="left:${idealPct}%"></div></div>
          <div class="rubric-value mono">${v!=null?v.toFixed(1):'—'}<span class="rv-of">/10</span></div>
          <div class="rubric-gap mono gap-${v!=null?gapClass(gap):''}">${v==null?'':(gap<=0?'At ideal':'−'+gap.toFixed(1))}</div>
        </div>`;
    }).join('');
    return `<div class="overall-hero">
        <div class="oh-score"><span class="oh-num mono">${overall!=null?overall.toFixed(1):'—'}</span><span class="oh-of">/ 10</span></div>
        <div class="oh-meta">
          <span class="rate-badge rate-${esc(tier.replace(/ /g,'-'))}">${esc(tier)}</span>
          <span class="oh-ideal">Ideal (Strong Hire bar): ${IDEAL_SCORE.toFixed(1)} / 10</span>
        </div>
      </div>
      <p class="standing-note">${esc(standingSentence(ev))}</p>
      <div class="rubric-table">${rows}</div>`;
  }

  function evalHtml(){
    const ev = session.evaluation;
    const totalMs = session.endedAt - session.startedAt;
    const phaseTimeHtml = PHASES.map((p,i) => `<div class="time-stat"><span class="ts-label">${esc(p)}</span><span class="ts-value mono">${fmtTime(session.phaseElapsed[i])}</span></div>`).join('');
    const transcriptBubbles = session.transcript.map(m => `<div class="bubble ${m.role}"><div class="b-role">${m.role==='candidate'?'You':'Interviewer'}</div>${esc(m.text)}</div>`).join('');

    let body;
    if(session.evalBusy){
      body = `<div class="empty-note"><span class="spinner"></span> Scoring your interview…</div>`;
    } else if(session.evalError && !ev){
      body = `<div class="note warn-note">${esc(session.evalError)}</div>`;
    } else if(ev){
      body = `${rubricHtml(ev)}
        <p class="eval-summary">${esc(ev.summary||'')}</p>
        <div class="eval-lists">
          <div class="eval-list strengths"><h5>Strengths</h5><ul>${(ev.strengths||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
          <div class="eval-list improve"><h5>Work on next</h5><ul>${(ev.improvements||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
        </div>`;
    } else {
      body = '';
    }

    return `<div class="card">
        <h2>${esc(session.case.title)}</h2>
        <div class="note" style="margin-top:4px;">${esc(session.case.firm)} · ${esc(session.case.sector)} · ${esc(session.difficulty)}</div>
        ${body}
        <div class="time-row">
          <div class="time-stat"><span class="ts-label">Total time</span><span class="ts-value mono">${fmtTime(totalMs)}</span></div>
          <div class="time-stat"><span class="ts-label">Thinking time</span><span class="ts-value mono">${fmtTime(session.thinking.totalMs)}</span></div>
          ${phaseTimeHtml}
        </div>
        ${!dbReady && ev ? '<div class="note" style="margin-top:10px;">Sign-in isn’t available in this view, so this result wasn’t saved to history — it’ll be gone once you leave this page.</div>' : ''}
        <details class="transcript-fold"><summary>Full transcript</summary><div class="transcript">${transcriptBubbles}</div></details>
        <div class="btn-row" style="margin-top:18px;">
          <button type="button" class="btn btn-primary" data-action="new-interview">New interview</button>
          <button type="button" class="btn btn-ghost" data-go="home">Back home</button>
        </div>
      </div>`;
  }

  function historyDetailHtml(){
    const h = historyDetail;
    const ev = h.evaluation;
    const transcriptBubbles = (h.transcript||[]).map(m => `<div class="bubble ${m.role}"><div class="b-role">${m.role==='candidate'?'You':'Interviewer'}</div>${esc(m.text)}</div>`).join('');
    const phaseTimeHtml = PHASES.map((p,i) => `<div class="time-stat"><span class="ts-label">${esc(p)}</span><span class="ts-value mono">${fmtTime((h.phaseElapsed||[])[i]||0)}</span></div>`).join('');
    return `<div class="card">
        <h2>${esc(h.caseTitle)}</h2>
        <div class="note" style="margin-top:4px;">${esc(h.caseFirm||'')} · ${esc(h.caseSector||'')} · ${esc(h.difficulty)} · ${relDate(h.createdAt)}</div>
        ${h.casePrompt ? `<div class="case-card" style="margin-top:14px;"><div class="cc-meta">Case prompt</div><p>${esc(h.casePrompt)}</p></div>` : ''}
        ${ev ? `${rubricHtml(ev)}<p class="eval-summary">${esc(ev.summary||'')}</p>
          <div class="eval-lists">
            <div class="eval-list strengths"><h5>Strengths</h5><ul>${(ev.strengths||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
            <div class="eval-list improve"><h5>Work on next</h5><ul>${(ev.improvements||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
          </div>` : ''}
        <div class="time-row">
          <div class="time-stat"><span class="ts-label">Total time</span><span class="ts-value mono">${fmtTime(h.totalMs||0)}</span></div>
          <div class="time-stat"><span class="ts-label">Thinking time</span><span class="ts-value mono">${fmtTime(h.thinkingMs||0)}</span></div>
          ${phaseTimeHtml}
        </div>
        <details class="transcript-fold" open><summary>Full transcript</summary><div class="transcript">${transcriptBubbles}</div></details>
        ${downloadNote ? `<div class="note" style="margin-top:10px;">${esc(downloadNote)}</div>` : ''}
        <div class="btn-row" style="margin-top:18px;">
          <button type="button" class="btn btn-ghost" data-go="home">Back home</button>
          ${downloadsApi ? `<button type="button" class="btn btn-ghost" data-download="${esc(h._id)}" ${downloadBusy?'disabled':''}>⬇ Download this interview</button>` : ''}
          ${dbReady ? (confirmDeleteId===h._id
            ? `<span class="confirm-inline">Delete this interview? <button type="button" class="btn-tiny btn-tiny-danger" data-delete-confirm="${esc(h._id)}" ${historyBusy?'disabled':''}>Yes, delete</button><button type="button" class="btn-tiny" data-delete-cancel>Cancel</button></span>`
            : `<button type="button" class="btn btn-ghost" data-delete-ask="${esc(h._id)}">Delete this interview</button>`) : ''}
        </div>
      </div>`;
  }

  // ---- event wiring ----
  function wire(){
    app.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => { view = el.dataset.go; render(); }));
    const themeBtn = app.querySelector('[data-action="theme"]');
    if(themeBtn) themeBtn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    });

    app.querySelectorAll('[data-source]').forEach(el => el.addEventListener('click', () => {
      setup.source = el.dataset.source; setup.pickedCase = null; setup.error = null; render();
    }));
    app.querySelectorAll('[data-diff]').forEach(el => el.addEventListener('click', () => {
      setup.difficulty = el.dataset.diff; render();
    }));
    app.querySelectorAll('[data-field]').forEach(el => el.addEventListener('change', () => {
      setup[el.dataset.field] = el.value; render();
    }));
    app.querySelectorAll('[data-field="sectorHint"]').forEach(el => el.addEventListener('input', () => {
      setup.sectorHint = el.value;
    }));

    const pickBtn = app.querySelector('[data-action="pick-book"]');
    if(pickBtn) pickBtn.addEventListener('click', pickRandomBookCase);
    const genBtn = app.querySelector('[data-action="gen-new"]');
    if(genBtn) genBtn.addEventListener('click', generateNewCase);
    const remixBtn = app.querySelector('[data-action="gen-remix"]');
    if(remixBtn) remixBtn.addEventListener('click', remixCase);
    const shuffleBtn = app.querySelector('[data-action="shuffle"]');
    if(shuffleBtn) shuffleBtn.addEventListener('click', () => {
      if(setup.source==='book') pickRandomBookCase();
      else if(setup.source==='ai-new') generateNewCase();
      else remixCase();
    });
    const startBtn = app.querySelector('[data-action="start-session"]');
    if(startBtn) startBtn.addEventListener('click', startSession);

    app.querySelectorAll('[data-action="toggle-tts"]').forEach(el => el.addEventListener('click', () => {
      ttsEnabled = !ttsEnabled; render();
    }));
    const micBtn = app.querySelector('[data-action="toggle-mic"]');
    if(micBtn) micBtn.addEventListener('click', toggleMic);

    const providerSelect = app.querySelector('#providerSelect');
    if(providerSelect) providerSelect.addEventListener('change', () => { setProvider(providerSelect.value); render(); });
    const toggleKeyVisibleBtn = app.querySelector('[data-action="toggle-key-visible"]');
    if(toggleKeyVisibleBtn) toggleKeyVisibleBtn.addEventListener('click', () => { apiKeyVisible = !apiKeyVisible; render(); });
    const saveKeyBtn = app.querySelector('[data-action="save-key"]');
    if(saveKeyBtn) saveKeyBtn.addEventListener('click', () => {
      const input = app.querySelector('#apiKeyInput');
      if(input && input.value.trim()) saveApiKey(input.value); // blank input = no-op, never overwrites a saved key with nothing
      render();
    });
    const clearKeyBtn = app.querySelector('[data-action="clear-key"]');
    if(clearKeyBtn) clearKeyBtn.addEventListener('click', () => { clearApiKey(); render(); });

    const historyBtns = app.querySelectorAll('[data-history]');
    historyBtns.forEach(el => el.addEventListener('click', () => openHistoryDetail(el.dataset.history)));
    app.querySelectorAll('[data-practice]').forEach(el => el.addEventListener('click', () => {
      setup.source = 'book'; setup.category = el.dataset.practice; setup.pickedCase = null; setup.error = null;
      render();
      const tabs = app.querySelector('.source-tabs');
      if(tabs) tabs.scrollIntoView({behavior:'smooth', block:'start'});
    }));

    app.querySelectorAll('[data-delete-ask]').forEach(el => el.addEventListener('click', () => { confirmDeleteId = el.dataset.deleteAsk; render(); }));
    app.querySelectorAll('[data-delete-cancel]').forEach(el => el.addEventListener('click', () => { confirmDeleteId = null; render(); }));
    app.querySelectorAll('[data-delete-confirm]').forEach(el => el.addEventListener('click', () => deleteAttempt(el.dataset.deleteConfirm)));
    const clearAskBtn = app.querySelector('[data-clear-ask]');
    if(clearAskBtn) clearAskBtn.addEventListener('click', () => { confirmClearAll = true; render(); });
    const clearCancelBtn = app.querySelector('[data-clear-cancel]');
    if(clearCancelBtn) clearCancelBtn.addEventListener('click', () => { confirmClearAll = false; render(); });
    const clearConfirmBtn = app.querySelector('[data-clear-confirm]');
    if(clearConfirmBtn) clearConfirmBtn.addEventListener('click', clearAllHistory);

    app.querySelectorAll('[data-download]').forEach(el => el.addEventListener('click', () => downloadOne(el.dataset.download)));
    const downloadProgressBtn = app.querySelector('[data-download-progress]');
    if(downloadProgressBtn) downloadProgressBtn.addEventListener('click', downloadProgress);
    const downloadSelectedBtn = app.querySelector('[data-download-selected]');
    if(downloadSelectedBtn) downloadSelectedBtn.addEventListener('click', downloadSelected);
    const selectStartBtn = app.querySelector('[data-select-start]');
    if(selectStartBtn) selectStartBtn.addEventListener('click', () => { selectMode = true; selectedIds = new Set(); downloadNote = null; render(); });
    const selectCancelBtn = app.querySelector('[data-select-cancel]');
    if(selectCancelBtn) selectCancelBtn.addEventListener('click', () => { selectMode = false; selectedIds = new Set(); render(); });
    app.querySelectorAll('[data-select]').forEach(el => el.addEventListener('change', () => {
      const id = el.dataset.select;
      if(el.checked) selectedIds.add(id); else selectedIds.delete(id);
      render();
    }));

    const thinkBtn = app.querySelector('[data-action="toggle-think"]');
    if(thinkBtn) thinkBtn.addEventListener('click', toggleThinking);
    const nextPhaseBtn = app.querySelector('[data-action="next-phase"]');
    if(nextPhaseBtn) nextPhaseBtn.addEventListener('click', advancePhase);
    const endBtn = app.querySelector('[data-action="end-session"]');
    if(endBtn) endBtn.addEventListener('click', endSession);
    const sendBtn = app.querySelector('[data-action="send"]');
    const input = document.getElementById('composeInput');
    if(sendBtn && input){
      sendBtn.addEventListener('click', () => { const v = input.value; input.value=''; sendCandidateMessage(v); });
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); const v = input.value; input.value=''; sendCandidateMessage(v); }
      });
      input.focus();
    }
    const newInterviewBtn = app.querySelector('[data-action="new-interview"]');
    if(newInterviewBtn) newInterviewBtn.addEventListener('click', backToHome);
  }

  // ---- boot ----
  async function boot(){
    app.innerHTML = topbarHtml() + `<div class="card"><div class="empty-note"><span class="spinner"></span> Loading the case bank…</div></div>`;
    await loadData();
    initCapabilities(); // fire and forget; UI renders without waiting
    render();
  }
  boot();
})();
</script>
</body>
</html>
